<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talos 品牌方向</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root { --page: #f4f4f2; --ink: #1a1a1a; --ink2: #6b6b6b; --line: rgba(0,0,0,.1); color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; -webkit-font-smoothing: antialiased; }
main { max-width: 1620px; margin: 0 auto; padding: 48px 32px 80px; }
.intro h1 { font-size: 28px; font-weight: 650; letter-spacing: -.02em; margin: 0 0 6px; }
.intro p { color: var(--ink2); margin: 0 0 40px; max-width: 760px; }
section.dir { margin: 0 0 72px; }
.head { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; margin-bottom: 20px; }
.head > div:nth-child(2) { flex: 1 1 360px; }
.mark { width: 96px; height: 96px; border-radius: 22px; display: grid; place-items: center; }
.head h2 { font-size: 22px; font-weight: 650; letter-spacing: -.015em; margin: 0; }
.head h2 small { font-size: 14px; font-weight: 500; color: var(--ink2); margin-left: 10px; letter-spacing: 0; }
.head p { margin: 4px 0 0; color: var(--ink2); max-width: 720px; }
.swatches { display: flex; gap: 6px; }
.sw { width: 44px; text-align: center; font: 10.5px/1.3 ui-monospace, "SF Mono", monospace; color: var(--ink2); }
.sw i { display: block; height: 44px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 4px; }
.pair > div { overflow-x: auto; padding: 2px 2px 40px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
@media (max-width: 1500px) { .pair { grid-template-columns: 1fr; } }

/* the window, themed through --bg … --acc */
.win { min-width: 780px; height: 540px; border-radius: 12px; overflow: hidden; display: grid; grid-template-columns: 236px 1fr; background: var(--bg); color: var(--fg); box-shadow: 0 0 0 .5px var(--edge), 0 24px 60px -20px rgba(0,0,0,.35); font-size: 13.5px; line-height: 1.55; font-feature-settings: "tnum"; }
.side { background: var(--side); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; border-right: .5px solid var(--edge); }
.lights { display: flex; gap: 8px; padding: 4px 8px 16px; }
.lights b { width: 12px; height: 12px; border-radius: 50%; background: var(--dot); }
.newbtn { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: var(--fg); font-weight: 500; margin-bottom: 10px; }
.newbtn kbd { margin-left: auto; font: 11.5px -apple-system; color: var(--mute); }
.group { font-size: 11.5px; font-weight: 600; color: var(--mute); padding: 10px 10px 4px; letter-spacing: .01em; }
.row { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 7px; font-size: 13px; color: var(--fg2); white-space: nowrap; }
.row.on { background: var(--sel); color: var(--fg); }
.row .t { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.row .ago { font-size: 11.5px; color: var(--mute); }
.slot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.slot.run { border: 1.5px solid var(--live); border-right-color: transparent; width: 10px; height: 10px; margin: -1px; }
.slot.wait { background: var(--live); }
.slot.unread { background: var(--fg2); width: 6px; height: 6px; margin: 1px; }
.slot.none { background: transparent; }
.main { display: flex; flex-direction: column; min-width: 0; }
.bar { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 20px; font-size: 13px; color: var(--fg2); }
.bar .ttl { white-space: nowrap; color: var(--fg); font-weight: 600; }
.bar .ws { white-space: nowrap; font: 12px ui-monospace, "SF Mono", monospace; color: var(--mute); }
.bar .r { margin-left: auto; display: flex; gap: 14px; font-size: 16px; color: var(--mute); }
.flow { flex: 1; padding: 6px 0 0; overflow: hidden; }
.col { max-width: 600px; margin: 0 auto; padding: 0 24px; }
.user { border-left: 2px solid var(--rule); padding: 1px 0 1px 12px; font-weight: 500; margin: 6px 0 14px; }
.tool { display: flex; align-items: center; gap: 8px; height: 26px; font-size: 12.5px; color: var(--fg2); }
.tool i { font-size: 15px; color: var(--mute); }
.tool code { font: 12px ui-monospace, "SF Mono", monospace; color: var(--fg); }
.tool .add { color: var(--plus); font: 12px ui-monospace, monospace; }
.tool .del { color: var(--minus); font: 12px ui-monospace, monospace; }
.say { margin: 10px 0; }
.say code { font: 12.5px ui-monospace, "SF Mono", monospace; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
.card { border-radius: 10px; background: var(--card); box-shadow: 0 0 0 .5px var(--edge2); padding: 12px 14px; margin: 12px 0; }
.card .k { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--fg2); }
.card .k .slot { margin-right: 2px; }
.card pre { margin: 8px 0 4px; font: 12.5px ui-monospace, "SF Mono", monospace; color: var(--fg); }
.card .why { font-size: 12px; color: var(--mute); }
.btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
.b { height: 28px; padding: 0 12px; border-radius: 7px; font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; color: var(--fg); box-shadow: 0 0 0 .5px var(--edge2); }
.b.p { background: var(--acc); color: var(--onacc); box-shadow: none; }
.composer { margin: 0 auto 18px; width: calc(100% - 48px); max-width: 600px; border-radius: 14px; background: var(--card); box-shadow: 0 0 0 .5px var(--edge2); padding: 12px 12px 8px 14px; }
.composer .ph { color: var(--mute); height: 40px; }
.ctl { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--fg2); }
.ctl span { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 6px; }
.ctl i { font-size: 15px; }
.ctl .ctx { margin-left: auto; color: var(--mute); font-variant-numeric: tabular-nums; }
.send { width: 28px; height: 28px; border-radius: 50%; background: var(--acc); color: var(--onacc); display: grid; place-items: center; font-size: 16px; margin-left: 6px; }
.queued { font-size: 12px; color: var(--mute); display: flex; gap: 6px; align-items: center; margin: 4px 0 0; }
</style>
</head>
<body>
<main>
  <div class="intro">
    <h1>Talos 品牌方向</h1>
    <p>以隔壁 ogma 的色板为底：蓝色基调，克制、冷淡。标志用同一套语法——ogma 是一条横的茎线加刻痕；Talos 是一条竖的血脉（蓝）被一枚铜钉（横）封住，合起来正是字母 T。三个方向只差在强调色怎么用。</p>
  </div>
  <div id="dirs"></div>
</main>

<template id="window">
  <div class="win">
    <aside class="side">
      <div class="lights"><b></b><b></b><b></b></div>
      <div class="newbtn"><i class="ti ti-edit"></i>新会话<kbd>⌘N</kbd></div>
      <div class="group">需要你</div>
      <div class="row on"><span class="slot wait"></span><span class="t">修复 Add 测试</span><span class="ago">刚刚</span></div>
      <div class="group">talos</div>
      <div class="row"><span class="slot run"></span><span class="t">沙箱 profile 收紧</span><span class="ago">2 分</span></div>
      <div class="row"><span class="slot unread"></span><span class="t">client 按日志重建</span><span class="ago">1 时</span></div>
      <div class="row"><span class="slot none"></span><span class="t">协议定稿</span><span class="ago">昨天</span></div>
      <div class="group">site</div>
      <div class="row"><span class="slot none"></span><span class="t">首页文案改写</span><span class="ago">周一</span></div>
    </aside>
    <div class="main">
      <div class="bar"><span class="ttl">修复 Add 测试</span><span class="ws">~/Projects/calc</span><span class="r"><i class="ti ti-git-branch"></i><i class="ti ti-layout-sidebar-right"></i></span></div>
      <div class="flow"><div class="col">
        <div class="user">Add 的测试挂了，帮我修一下</div>
        <div class="tool"><i class="ti ti-file-text"></i>读取 <code>add.go</code></div>
        <div class="tool"><i class="ti ti-file-text"></i>读取 <code>add_test.go</code></div>
        <div class="say"><code>Add</code> 写成了减法，改成 <code>a + b</code>。</div>
        <div class="tool"><i class="ti ti-pencil"></i>编辑 <code>add.go</code> <span class="add">+1</span><span class="del">−1</span></div>
        <div class="card">
          <div class="k"><span class="slot wait"></span>运行命令</div>
          <pre>go test ./...</pre>
          <div class="why">它会在沙箱里运行一条命令：无网络，只能写工作区。</div>
          <div class="btns"><span class="b">拒绝</span><span class="b">本会话都允许</span><span class="b p">允许</span></div>
        </div>
      </div></div>
      <div class="composer">
        <div class="ph">回复，或输入 / 调用命令</div>
        <div class="ctl"><span><i class="ti ti-paperclip"></i></span><span>gpt-6-luna · 中</span><span><i class="ti ti-shield-half"></i>询问</span><span class="ctx">上下文 12%</span><span class="send"><i class="ti ti-arrow-up"></i></span></div>
      </div>
    </div>
  </div>
</template>

<script>
const marks = {
  vein: (stem, nail) => `<svg width="60" height="60" viewBox="0 0 120 120"><rect x="54" y="30" width="12" height="70" fill="${stem}"/><rect x="30" y="18" width="60" height="12" fill="${nail}"/></svg>`,
};
const dirs = [
  { name: '同族', en: 'Kin', mark: 'vein',
    line: '原样沿用 ogma 的色板：Paper / Ink 作底，Slate / Mist 作次要文字，Ogma Blue / Night 作强调。两个产品一眼就是一家。',
    light: { bg:'#F4F5F7', side:'#EAECF0', fg:'#12131A', fg2:'#5B6272', mute:'#8A91A0', edge:'rgba(18,19,26,.12)', edge2:'rgba(18,19,26,.14)', sel:'rgba(18,19,26,.06)', card:'#FFFFFF', chip:'rgba(18,19,26,.055)', rule:'#C4C9D3', dot:'#D5D9E0', plus:'#3B7356', minus:'#A8474B', acc:'#2B5FA6', live:'#2B5FA6', onacc:'#F4F5F7' },
    dark:  { bg:'#12131A', side:'#171922', fg:'#E8EAEF', fg2:'#A9B1C1', mute:'#6E7587', edge:'rgba(169,177,193,.11)', edge2:'rgba(169,177,193,.15)', sel:'rgba(169,177,193,.08)', card:'#1C1E28', chip:'rgba(169,177,193,.09)', rule:'#343846', dot:'#2A2D38', plus:'#7DB89A', minus:'#DD878B', acc:'#7AA8EA', live:'#7AA8EA', onacc:'#12131A' } },
  { name: '同底异蓝', en: 'Tide', mark: 'vein',
    line: '中性色与 ogma 相同，强调色换成更冷、略偏青的海蓝，取自绕岛巡守的那片海。并排放时分得清，又明显是同一个家族。',
    light: { bg:'#F4F5F7', side:'#EAECF0', fg:'#12131A', fg2:'#5B6272', mute:'#8A91A0', edge:'rgba(18,19,26,.12)', edge2:'rgba(18,19,26,.14)', sel:'rgba(18,19,26,.06)', card:'#FFFFFF', chip:'rgba(18,19,26,.055)', rule:'#C4C9D3', dot:'#D5D9E0', plus:'#3B7356', minus:'#A8474B', acc:'#246E8A', live:'#246E8A', onacc:'#F4F5F7' },
    dark:  { bg:'#12131A', side:'#171922', fg:'#E8EAEF', fg2:'#A9B1C1', mute:'#6E7587', edge:'rgba(169,177,193,.11)', edge2:'rgba(169,177,193,.15)', sel:'rgba(169,177,193,.08)', card:'#1C1E28', chip:'rgba(169,177,193,.09)', rule:'#343846', dot:'#2A2D38', plus:'#7DB89A', minus:'#DD878B', acc:'#7FC2DA', live:'#7FC2DA', onacc:'#0E1A20' } },
  { name: '单色', en: 'Mono', mark: 'vein',
    line: 'ogma 的中性色，按钮只用 Ink / Paper 单色；蓝色只留给「活着的东西」：运行中与等你处理的状态点。最克制、最冷淡。',
    light: { bg:'#F4F5F7', side:'#EAECF0', fg:'#12131A', fg2:'#5B6272', mute:'#8A91A0', edge:'rgba(18,19,26,.12)', edge2:'rgba(18,19,26,.14)', sel:'rgba(18,19,26,.06)', card:'#FFFFFF', chip:'rgba(18,19,26,.055)', rule:'#C4C9D3', dot:'#D5D9E0', plus:'#3B7356', minus:'#A8474B', acc:'#12131A', live:'#2B5FA6', onacc:'#F4F5F7' },
    dark:  { bg:'#12131A', side:'#171922', fg:'#E8EAEF', fg2:'#A9B1C1', mute:'#6E7587', edge:'rgba(169,177,193,.11)', edge2:'rgba(169,177,193,.15)', sel:'rgba(169,177,193,.08)', card:'#1C1E28', chip:'rgba(169,177,193,.09)', rule:'#343846', dot:'#2A2D38', plus:'#7DB89A', minus:'#DD878B', acc:'#E8EAEF', live:'#7AA8EA', onacc:'#12131A' } },
];
const tpl = document.getElementById('window').innerHTML;
const vars = t => Object.entries(t).map(([k, v]) => `--${k}:${v}`).join(';');
document.getElementById('dirs').innerHTML = dirs.map((d, i) => `
  <section class="dir">
    <div class="head">
      <div class="mark" style="background:${d.dark.bg}">${marks.vein(d.dark.live, '#F4F5F7')}</div>
      <div><h2>${String.fromCharCode(65 + i)} · ${d.name}<small>${d.en}</small></h2><p>${d.line}</p></div>
      <div class="swatches">${[['bg', d.light.bg], ['side', d.light.side], ['fg', d.light.fg], ['acc', d.light.live], ['bg', d.dark.bg], ['card', d.dark.card], ['fg', d.dark.fg], ['acc', d.dark.live]].map(([k, v]) => `<div class="sw"><i style="background:${v}"></i>${v.slice(1)}</div>`).join('')}</div>
    </div>
    <div class="pair"><div style="${vars(d.light)}">${tpl}</div><div style="${vars(d.dark)}">${tpl}</div></div>
  </section>`).join('');
</script>
</body>
</html>
