<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stratum</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="root">
    <div id="diffs-view" class="view hidden"></div>
    <div id="files-view" class="view hidden">
      <div id="files-main">
        <div id="files-bar">
          <div id="files-tabs"></div>
          <div id="files-actions">
            <div id="md-toggle" class="seg hidden">
              <button id="md-preview-btn" type="button" class="seg-btn active">Preview</button>
              <button id="md-raw-btn" type="button" class="seg-btn">Raw</button>
            </div>
            <button id="open-ext-btn" type="button" class="icon-btn hidden" title="Open externally" aria-label="Open externally">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
            </button>
            <button id="tree-toggle-btn" type="button" class="icon-btn" title="Toggle Workspace Tree" aria-label="Toggle Workspace Tree">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>
            </button>
          </div>
        </div>
        <div id="files-body">
          <div id="files-empty">Select a file from the workspace tree to preview</div>
          <div id="files-code" class="hidden"></div>
          <div id="files-md" class="hidden markdown-body"></div>
        </div>
      </div>
      <aside id="tree-pane">
        <div id="tree-host"></div>
      </aside>
    </div>
  </div>

  <div id="find-bar" class="hidden">
    <input id="find-input" type="text" placeholder="Find in view..." />
    <span id="find-count"></span>
    <button id="find-prev" type="button" class="icon-btn" title="Previous" aria-label="Previous">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
    </button>
    <button id="find-next" type="button" class="icon-btn" title="Next" aria-label="Next">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button id="find-close" type="button" class="icon-btn" title="Close" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <dialog id="remark-modal">
    <div class="remark-card">
      <div class="remark-title" id="remark-title">Add line comment</div>
      <textarea id="remark-text" rows="3" placeholder="Comment for the agent..."></textarea>
      <div class="remark-actions">
        <button id="remark-cancel" type="button" class="btn">Cancel</button>
        <button id="remark-submit" type="button" class="btn btn-primary">Add</button>
      </div>
    </div>
  </dialog>

  <script src="/bundle.js"></script>
</body>
</html>
